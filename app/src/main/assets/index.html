<script>
(()=>{
const N=4;
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
const save={unlocked:1,best:0,cleared:[],sound:true};
try{Object.assign(save,JSON.parse(localStorage.getItem('sumpop')||'{}'))}catch(e){}
function persist(){try{localStorage.setItem('sumpop',JSON.stringify(save))}catch(e){}}
// Points: `wallet` is spendable, `lifetime` only grows and sets the title. Existing players start with what they had.
if(save.wallet===undefined)save.wallet=save.total||0;
if(save.lifetime===undefined)save.lifetime=save.total||0;
function earn(n){n=Math.max(0,Math.round(n||0));save.wallet+=n;save.lifetime+=n;persist();return n}

/* ---------- seeded random ---------- */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

/* ---------- level design ---------- */
// Difficulty tiers start at levels 1, 10, 30, 60, 100, then every 100 (200, 300, …).
function tierOf(n){return n<10?0:n<30?1:n<60?2:n<100?3:3+Math.floor(n/100)}
function tierStart(k){return [1,10,30,60][k]??(k-3)*100}
function levelCfg(n){
  const r=mulberry32(n*7919+17);const pick=a=>a[Math.floor(r()*a.length)];
  const k=tierOf(n),p=n-tierStart(k);let c;
  if(k===0)c={min:1,max:n<=4?5:6,zero:0,target:pick(n<=3?[5,6,7]:[5,6,7,8,9]),goal:3+Math.ceil(n/2),minLen:2};

/* ---------- state ---------- */

/* ---------- start ---------- */

/* ---------- daily puzzle ---------- */
function dayKey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}

/* ---------- path / sum bar ---------- */

/* ---------- input ---------- */

function cellAt(x,y,loose){
  const r=$('tiles').getBoundingClientRect(),cs=r.width/N;
  const cx=(x-r.left)/cs,cy=(y-r.top)/cs,c=Math.floor(cx),rw=Math.floor(cy);
  if(c<0||c>=N||rw<0||rw>=N)return -1;
  const dx=cx-c-.5,dy=cy-rw-.5;

board.addEventListener('pointerdown',e=>{
  if(S.busy||S.over)return;const i=cellAt(e.clientX,e.clientY,true);if(i<0||!S.board[i])return;
  if(S.board[i].lock){lockedTap(i);e.preventDefault();return}
  if(save.tapMode){audioInit();tapSelect(i);e.preventDefault();return}
  audioInit();dragging=true;board.setPointerCapture(e.pointerId);S.path=[i];drawPath();e.preventDefault();
});

/* ---------- resolve a drag ---------- */

  const sum=p.reduce((a,i)=>a+S.board[i].v,0);
  if(sum!==S.target){miss(p,`합이 ${fmt(sum)}${ieyo(sum)}. 목표는 ${fmt(S.target)}!`);return}
  if(p.length<S.minLen){miss(p,`이번엔 ${S.minLen}개 이상 이어야 해요`);return}

// After blocks fall, make sure the new ones leave at least one answer on the board.
function refillSmart(){
  if(findSolution())return;
  const fresh=S.board.filter(t=>t&&t.from!=null);

    fresh.forEach(t=>{t.v=genValue();if(k>20)delete t.lock});
    if(findSolution())return;
  }

function collapse(){
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){const t=S.board[r*N+c];if(t){S.board[r*N+c]=null;S.board[w*N+c]=t;w--}}
    const missing=w+1;
    for(let r=w;r>=0;r--){const t=newTile();t.from=r-missing;S.board[r*N+c]=t}
  }
}
function nextEndlessTarget(){

  S.target=nt;S.goal=4;toast(`목표가 ${fmt(nt)}${ro(nt)} 바뀌었어요`);
}
function afterMove(){
  S.busy=false;

// Streak gifts: every 3rd day in a row +1 bonus hint, every 7th day +3.

function importCode(code){
  const m=String(code||'').trim().replace(/\s+/g,'').match(/^PANG1\.([A-Za-z0-9_-]+)$/);if(!m)return null;
  try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));return j&&typeof j.unlocked==='number'?j:null}catch(e){return null}
}

/* first-play coach: a finger traces a real solution on the board until the player pops once */
let coach=null;
function startCoach(){
  if(!S||S.over||S.mode!=='stage')return;
  const sol=findSolution();if(!sol)return;
  stopCoach();
  const f=document.createElement('div');f.className='finger';f.setAttribute('aria-hidden','true');board.appendChild(f);
  const pts=sol.map(i=>({left:`${(i%N+.5)*25}%`,top:`${(Math.floor(i/N)+.5)*25}%`}));
  const kf=[{...pts[0],opacity:0,transform:'translate(-50%,-50%) scale(1.25)'},{...pts[0],opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.12}];
  pts.slice(1).forEach((p,k)=>kf.push({...p,opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.12+.6*(k+1)/(pts.length-1)}));
  kf.push({...pts[pts.length-1],opacity:0,transform:'translate(-50%,-50%) scale(1)',offset:1});
  const anim=f.animate(kf,{duration:900+700*pts.length,iterations:Infinity,easing:'ease-in-out'});
  sol.forEach(i=>els.get(S.board[i].id)?.classList.add('coach'));
  coach={f,anim,ids:sol.map(i=>S.board[i].id)};
  $('sumbar').className='sumbar idle coach-tip';
  $('sumbar').innerHTML=save.tapMode?`반짝이는 숫자를 차례로 눌러 합을 <b>${fmt(S.target)}</b>${ro(S.target)} 만들고<br>팡! 버튼을 눌러 보세요`:`옆에 붙은 숫자를 손가락으로 쭉 이어서<br>합을 <b>${fmt(S.target)}</b>${ro(S.target)} 만들어 보세요`;
}
function stopCoach(){
  if(!coach)return;coach.anim.cancel();coach.f.remove();
  coach.ids.forEach(id=>els.get(id)?.classList.remove('coach'));coach=null;
}
board.addEventListener('pointerdown',()=>{if(coach)coach.f.style.visibility='hidden'},true);
board.addEventListener('pointerup',()=>{if(coach){coach.f.style.visibility='';setTimeout(()=>{if(coach&&!S.path.length)startCoach()},60)}});
$('sumbar').addEventListener('click',()=>{if(coach)setTimeout(()=>{if(coach&&!S.path.length)startCoach()},60)});
